sdk_names:
  model_name: auto-scaling

operations:
  DeleteAutoScalingGroup:
    override_values:
      # Always force delete to avoid "ScalingActivityInProgress" errors
      # This allows deletion even when scaling activities are in progress
      ForceDelete: aws.Bool(true)
  DescribeAutoScalingGroups:
    override_values:
      # Exclude instance details from the response to avoid bloating the
      # CR object in etcd. ASGs can have thousands of instances and each
      # Instance entry is ~300-500 bytes. The controller doesn't need
      # instance data for reconciliation.
      IncludeInstances: aws.Bool(false)

resources:
  AutoScalingGroup:
    fields:
      Name:
        is_primary_key: true
        is_immutable: true
      # Late-initialized fields: AWS assigns server-side defaults to these
      # when not set by the user, causing perpetual reconciliation churn.
      AvailabilityZoneDistribution:
        late_initialize:
          skip_incomplete_check: {}
      AvailabilityZones:
        late_initialize:
          skip_incomplete_check: {}
      # set: ignore keeps the Create/Update response from writing this struct
      # back over the capacityReservationRefs companions below; the existing
      # late_initialize then remains responsible for absorbing the AWS default,
      # which the write-back had previously been doing incidentally.
      CapacityReservationSpecification:
        late_initialize:
          skip_incomplete_check: {}
        set:
          - method: Create
            ignore: true
          - method: Update
            ignore: true
      CapacityReservationSpecification.CapacityReservationTarget.CapacityReservationIDs:
        references:
          resource: CapacityReservation
          service_name: ec2
          path: Status.CapacityReservationID
      InstanceLifecyclePolicy:
        late_initialize:
          skip_incomplete_check: {}
      NewInstancesProtectedFromScaleIn:
        late_initialize:
          skip_incomplete_check: {}
      TerminationPolicies:
        late_initialize:
          skip_incomplete_check: {}
      CreatedTime:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.CreatedTime
      EnabledMetrics:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.EnabledMetrics
      SuspendedProcesses:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.SuspendedProcesses
      Status:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.Status
      PredictedCapacity:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.PredictedCapacity
      WarmPoolConfiguration:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.WarmPoolConfiguration
      WarmPoolSize:
        is_read_only: true
        from:
          operation: DescribeAutoScalingGroups
          path: AutoScalingGroups.WarmPoolSize
      # Fix type_ -> type for TrafficSources
      TrafficSources.Type:
        go_tag: json:"type,omitempty"
      # Cross-resource reference to EC2 Instance
      InstanceID:
        references:
          resource: Instance
          service_name: ec2
          path: Status.InstanceID
      # Cross-resource reference to IAM ServiceLinkedRole
      ServiceLinkedRoleARN:
        late_initialize:
          skip_incomplete_check: {}
        references:
          resource: ServiceLinkedRole
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
      # Cross-resource reference to IAM Role for lifecycle hooks
      LifecycleHookSpecificationList.RoleARN:
        references:
          resource: Role
          service_name: iam
          path: Status.ACKResourceMetadata.ARN
      # TODO: Enable LaunchTemplate references. The original blocker in
      # https://github.com/aws-controllers-k8s/autoscaling-controller/pull/3 - the
      # code-generator emitting the *Ref companions into Status as well as Spec -
      # is FIXED as of code-generator v0.62.0; verified by generating
      # LaunchTemplate.LaunchTemplateName locally and finding no *Ref anywhere in
      # the CRD status. A different blocker remains.
      #
      # LaunchTemplateSpecification is a shared Go struct, used at all three of:
      #   launchTemplate
      #   mixedInstancesPolicy.launchTemplate.launchTemplateSpecification
      #   mixedInstancesPolicy.launchTemplate.overrides[].launchTemplateSpecification
      # so configuring a reference on any one path adds launchTemplateRef to the
      # struct and therefore to all three positions in the CRD - while only the
      # configured paths get a resolveReferenceFor* function. The third path
      # would expose a launchTemplateRef that is silently never resolved and
      # never validated.
      #
      # Wiring all three fixes that but then hits the delta: overrides is a list,
      # so the generated comparison is a whole-list DeepEqual (see delta.go),
      # which sees the *Ref members that sdkFind cannot reconstruct from
      # DescribeAutoScalingGroups and diffs on every reconcile. Closing the group
      # therefore needs all three references plus *Ref normalization in the
      # existing delta_pre_compare hook, and live validation - not a
      # generator.yaml-only change. Note the ID form cannot be used either: it is
      # in ignore.field_paths below, and the Describe response echoes the
      # template name, so the target path is ec2 LaunchTemplate's Spec.Name.
      # Cross-resource reference to ELBv2 TargetGroups
      TargetGroupARNs:
        references:
          resource: TargetGroup
          service_name: elbv2
          path: Status.ACKResourceMetadata.ARN
    exceptions:
      terminal_codes:
        - ValidationError
        - AlreadyExists
        - LimitExceeded
    renames:
      operations:
        CreateAutoScalingGroup:
          input_fields:
            AutoScalingGroupName: Name
        UpdateAutoScalingGroup:
          input_fields:
            AutoScalingGroupName: Name
        DeleteAutoScalingGroup:
          input_fields:
            AutoScalingGroupName: Name
        DescribeAutoScalingGroups:
          input_fields:
            AutoScalingGroupNames: Names
          output_fields:
            AutoScalingGroupName: Name
    hooks:
      delta_pre_compare:
        template_path: hooks/auto_scaling_group/delta_pre_compare.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/auto_scaling_group/sdk_update_pre_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/auto_scaling_group/sdk_create_post_set_output.go.tpl

ignore:
  resource_names:
    - LaunchConfiguration
  field_paths:
    # remove reserved field
    - CreateAutoScalingGroupInput.Context
    # DeletionProtection is a new SDK field not yet supported by this controller
    - CreateAutoScalingGroupInput.DeletionProtection
    - UpdateAutoScalingGroupInput.DeletionProtection
    - DescribeAutoScalingGroupsOutput.AutoScalingGroups.DeletionProtection
    # Ignore LaunchTemplateId to avoid ID vs Name conflict.
    # AWS returns both fields in responses even when only one is specified.
    # Supporting only LaunchTemplateName avoids reconciliation drift issues and the need for custom code
    - CreateAutoScalingGroupInput.LaunchTemplate.LaunchTemplateId
    - UpdateAutoScalingGroupInput.LaunchTemplate.LaunchTemplateId
    - DescribeAutoScalingGroupsOutput.AutoScalingGroups.LaunchTemplate.LaunchTemplateId
    - DescribeAutoScalingGroupsOutput.AutoScalingGroups.MixedInstancesPolicy.LaunchTemplate.LaunchTemplateSpecification.LaunchTemplateId
    - DescribeAutoScalingGroupsOutput.AutoScalingGroups.MixedInstancesPolicy.LaunchTemplate.Overrides.LaunchTemplateSpecification.LaunchTemplateId
    # Only keep Key and Value for tags - remove PropagateAtLaunch, ResourceId, ResourceType
    # Target the shared Tag and TagDescription shapes directly so fields are
    # removed from both the generated Go types and the CRD schema
    - Tag.PropagateAtLaunch
    - Tag.ResourceId
    - Tag.ResourceType
    - TagDescription.PropagateAtLaunch
    - TagDescription.ResourceId
    - TagDescription.ResourceType
    # Exclude Instances from the DescribeAutoScalingGroups output.
    # Instance data is not needed for reconciliation and can bloat the
    # CR object beyond etcd's 1.5MB limit for large ASGs.
    - DescribeAutoScalingGroupsOutput.AutoScalingGroups.Instances